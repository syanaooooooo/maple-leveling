<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#9BD9F2">
<title>冒险岛升级计划</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <div class="sky">
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  </div>

  <header class="topbar">
    <h1 class="logo">冒险岛 升级计划</h1>
    <div class="topright">
      <div class="sync" id="sync-badge"><i></i><span>本地</span></div>
      <button class="btn tiny" id="logout" hidden>退出</button>
    </div>
  </header>

  <div id="gate" class="gate">
    <form class="gate-box" id="gate-form">
      <div class="gate-sprite" id="gate-sprite"></div>
      <div class="gate-t">登录</div>
      <input type="email" id="gate-email" placeholder="邮箱" autocomplete="username" required>
      <input type="password" id="gate-pw" placeholder="密码" autocomplete="current-password" required>
      <button class="btn primary" type="submit" id="gate-go">进去</button>
      <div class="gate-err" id="gate-err"></div>
      <div class="gate-note">密码直接发给 Supabase 校验，不经过这个网站的代码，也不会存在你的浏览器里。</div>
    </form>
  </div>

  <main id="app" hidden></main>

  <footer class="foot">
    <span class="en">CMS079</span> 怀旧服经验表 · 数据自动同步
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=1"></script>
  <script src="exp-table.js?v=1"></script>
  <script src="maps.js?v=1"></script>
  <script src="sync.js?v=3"></script>
  <script src="app.js?v=19"></script>
</body>
</html>
